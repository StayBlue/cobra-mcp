name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  licenses:
    name: Rust licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2

      - name: Generate
        run: cargo about generate --locked --fail about.hbs -o rust-crates-LICENSES.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-licenses
          path: rust-crates-LICENSES.txt
          if-no-files-found: error

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # Ubuntu 22.04 keeps the glibc requirement at 2.35; GCC 14 comes from the
      # toolchain PPA. libstdc++ is linked statically so the binary does not
      # depend on the system's libstdc++ version.
      - name: Set up toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ninja-build
          triple=$(tr a-z- A-Z_ <<< "${{ matrix.target }}")
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
            echo "CXXSTDLIB=static=stdc++"
            echo "CARGO_TARGET_${triple}_LINKER=gcc-14"
            echo "CARGO_TARGET_${triple}_RUSTFLAGS=-L native=$(dirname "$(g++-14 -print-file-name=libstdc++.a)")"
          } >> "$GITHUB_ENV"

      - name: Set up toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      # Git Bash's coreutils `link` would otherwise shadow MSVC's link.exe.
      - name: Set up toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress
          linker="${VCToolsInstallDir}bin\\HostX64\\x64\\link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          bin=target/release/cobra-mcp
          [[ "$RUNNER_OS" == Windows ]] && bin+=.exe
          if [[ "$RUNNER_OS" == Linux ]] && ldd "$bin" | grep libstdc++; then
            echo "libstdc++ is dynamically linked" >&2
            exit 1
          fi
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"simplify","arguments":{"expr":"(x&y)+(x|y)"}}}' \
            | "$bin" | tee response.jsonl
          grep -q '"expr":"x + y"' response.jsonl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-licenses

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$GITHUB_REF_NAME
          else
            version=${GITHUB_SHA::7}
          fi
          name=cobra-mcp-$version-${{ matrix.target }}
          mkdir -p "$name/licenses" dist

          cp LICENSE "$name/"
          cp rust-crates-LICENSES.txt "$name/licenses/"
          # Abseil and Highway are fetched by CoBRA's dependency build.
          src=$(find target/release/build -path '*/out/deps/build' -type d | head -1)
          cp vendor/CoBRA/LICENSE "$name/licenses/CoBRA-LICENSE"
          cp "$src/abseil-prefix/src/abseil/LICENSE" "$name/licenses/abseil-LICENSE"
          cp "$src/highway-prefix/src/highway/LICENSE" "$name/licenses/highway-LICENSE"
          cp "$src/highway-prefix/src/highway/LICENSE-BSD3" "$name/licenses/highway-LICENSE-BSD3"
          cp README.md "$name/"

          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/cobra-mcp.exe "$name/"
            7z a -tzip "dist/$name.zip" "$name" > /dev/null
          else
            cp target/release/cobra-mcp "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*
