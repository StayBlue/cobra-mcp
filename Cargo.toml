[package]
name = "cobra-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for CoBRA, the Mixed Boolean-Arithmetic expression simplifier"
publish = false

[dependencies]
cxx = "1"
rmcp = { version = "3.5.1", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
cc = "1"
cmake = "0.1"
cxx-build = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
